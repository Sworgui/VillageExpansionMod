name: Build Fabric mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Run JUnit tests and build mod
        run: gradle clean test build

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: village-expansion-test-reports-1.4.14
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: village-expansion-1.4.14
          path: build/libs/village-expansion-1.4.14.jar
          if-no-files-found: error
          retention-days: 14
